<!doctype html>
<html lang="tr">
<head><meta charset="utf-8">
<link rel="stylesheet" href="tema.css">
<style>
  html, body, #root { margin: 0; background: var(--zemin); }
  .y { position: absolute; left: 60px; top: 200px; color: var(--yazi); font-family: var(--font); font-weight: 800; font-size: 72px; }
  .v { color: var(--vurgu); }
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="2" data-width="960" data-height="540" data-fps="30">
  <div id="kart" class="clip" data-start="0" data-duration="2" data-track-index="1">
    <div id="y" class="y">Işık <span class="v">ĞÜŞİÖÇ</span> ğüşıöç</div>
  </div>
</div>
<script src="gsap.min.js"></script>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  tl.fromTo("#y", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "power3.out" }, 0);
  window.__timelines["main"] = tl;
</script>
</body></html>
