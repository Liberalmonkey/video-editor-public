<!--meta
{"name": "glass-pill", "description": "Buzlu cam etiket hapı (ikon karosu + kısa etiket, ≤3 kelime). Konuşmacının dikey kartının (layout portrait) solunda/sağında, 3 dikey sırada; birden fazla hap birlikte görünür. tone=alert: kırmızı nokta + kırmızı ikon + hafif sallanma (sorun vurgusu).",
 "props": {"text": "string*", "icon": "enum(check|tooth|home|scissors|utensils|cart|message|calendar|camera|sparkle|chart|users)", "side": "enum(left|right)", "row": "enum(0|1|2)", "tone": "enum(default|alert)"},
 "default_dur": 2.5, "sfx": {"in": "tick"}, "tags": ["glass", "ornek-marka", "footage"]}
-->
<style>
/* Konum: portrait kartın (genişlik H*0.88*9/16, ortada) dışında. --card-half = kartın yarı genişliği (build: H*0.44*--portrait-ar). */
.blk-glass-pill .gp { position: absolute; top: calc(var(--H) * 0.34); margin-top: calc(var(--u) * -3.6);
  display: flex; align-items: center; gap: calc(var(--u) * 1.5); white-space: nowrap;
  padding: calc(var(--u) * 1) calc(var(--u) * 2.6) calc(var(--u) * 1) calc(var(--u) * 1);
  background: var(--c-glass); border: 1px solid var(--c-glass-border); border-radius: calc(var(--u) * 2);
  -webkit-backdrop-filter: blur(calc(var(--u) * 1.45)) saturate(1.15); backdrop-filter: blur(calc(var(--u) * 1.45)) saturate(1.15);
  box-shadow: 0 calc(var(--u) * 0.8) calc(var(--u) * 3) rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.10); }
.blk-glass-pill.side-left .gp { right: calc(var(--W) / 2 + var(--card-half) + var(--u) * 3); }
.blk-glass-pill.side-right .gp { left: calc(var(--W) / 2 + var(--card-half) + var(--u) * 3); }
.blk-glass-pill.row-1 .gp { top: calc(var(--H) * 0.46); }
.blk-glass-pill.row-2 .gp { top: calc(var(--H) * 0.58); }
.blk-glass-pill .gp-tile { position: relative; flex: none; width: calc(var(--u) * 6.0); height: calc(var(--u) * 6.0);
  border-radius: calc(var(--u) * 1.3); background: var(--c-glass-tile); border: 1px solid rgba(255,255,255,.08);
  display: grid; place-items: center; color: var(--c-fg); }
.blk-glass-pill .gp-ic { width: calc(var(--u) * 3.0); height: calc(var(--u) * 3.0); display: block; }
.blk-glass-pill .gp-dot { position: absolute; top: calc(var(--u) * -0.45); right: calc(var(--u) * -0.45);
  width: calc(var(--u) * 1.3); height: calc(var(--u) * 1.3); border-radius: 50%; background: var(--c-alert);
  box-shadow: 0 0 0 calc(var(--u) * 0.28) rgba(10,13,12,.55); display: none; }
.blk-glass-pill.tone-alert .gp-dot { display: block; }
.blk-glass-pill.tone-alert .gp-tile { color: var(--c-alert); }
.blk-glass-pill .gp-label { font: 600 calc(var(--u) * 3.6) / 1 var(--f-body); letter-spacing: -0.01em; color: var(--c-fg);
  text-shadow: 0 1px calc(var(--u) * 0.6) rgba(0,0,0,.22); padding-bottom: 0.04em; }
</style>
<markup>
<div class="blk blk-glass-pill side-{{side}} row-{{row}} tone-{{tone}}">
  <div class="gp">
    <div class="gp-tile"><svg class="gp-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg><span class="gp-dot"></span></div>
    <div class="gp-label">{{text}}</div>
  </div>
</div>
</markup>
<script>
// Lucide tarzı kontur ikonlar (24x24, stroke 2, yuvarlak uç) — diğer glass blokları da kullanır.
window.GLASS_ICONS = window.GLASS_ICONS || {
  tooth: '<path d="M7 3C4.8 3 3 4.8 3 7.2c0 2 .8 3.3 1.5 4.8.6 1.4.8 3 1.2 4.9.4 2.1 1 4.1 2.3 4.1 1.6 0 1.5-3 2.2-5 .3-.9.9-1.3 1.8-1.3s1.5.4 1.8 1.3c.7 2 .6 5 2.2 5 1.3 0 1.9-2 2.3-4.1.4-1.9.6-3.5 1.2-4.9.7-1.5 1.5-2.8 1.5-4.8C21 4.8 19.2 3 17 3c-1.8 0-2.8 1-5 1S8.8 3 7 3z"/>',
  home: '<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v11a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9"/>',
  scissors: '<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.12 15.88"/><path d="M14.47 14.48 20 20"/><path d="M8.12 8.12 12 12"/>',
  utensils: '<path d="M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2"/><path d="M7 2v20"/><path d="M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3zm0 0v7"/>',
  cart: '<circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/>',
  message: '<path d="M7.9 20A9 9 0 1 0 4 16.1L2 22z"/>',
  calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4"/><path d="M8 2v4"/><path d="M3 10h18"/>',
  camera: '<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
  sparkle: '<path d="M11 3.5l1.7 5.1a2 2 0 0 0 1.2 1.2L19 11.5l-5.1 1.7a2 2 0 0 0-1.2 1.2L11 19.5l-1.7-5.1a2 2 0 0 0-1.2-1.2L3 11.5l5.1-1.7a2 2 0 0 0 1.2-1.2z"/><path d="M19 2v4"/><path d="M17 4h4"/>',
  chart: '<path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/>',
  users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
  check: '<path d="M20 6 9 17l-5-5"/>'
};
window.GLASS_U = window.GLASS_U || function () {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--u")) || 14;
};
HF_BLOCKS["glass-pill"] = function (tl, el, P, T, S) {
  const gp = el.querySelector(".gp"), u = GLASS_U();
  el.querySelector(".gp-ic").innerHTML = GLASS_ICONS[P.icon] || GLASS_ICONS.check;
  const dir = P.side === "right" ? 1 : -1;            // dış taraf (ekran kenarı) yönü
  const tin = Math.min(0.45, T.dur * 0.4);
  tl.fromTo(gp, { opacity: 0, x: dir * u * 2.85, filter: "blur(12px)" },
    { opacity: 1, x: 0, filter: "blur(0px)", duration: tin, ease: S.ease.ui }, T.start);
  tl.set(gp, { filter: "none" }, T.start + tin);       // backdrop-filter'ı serbest bırak
  if (P.tone === "alert") {
    HF.pop(tl, el.querySelector(".gp-dot"), T.start + 0.25, S, { from: 0, dur: 0.3 });
    const s = T.start + tin, a = u * 0.28;
    tl.to(gp, { x: a, duration: 0.06, ease: "power2.out" }, s)
      .to(gp, { x: -a, duration: 0.08, ease: "power2.inOut" }, s + 0.06)
      .to(gp, { x: a, duration: 0.08, ease: "power2.inOut" }, s + 0.14)
      .to(gp, { x: 0, duration: 0.08, ease: "power2.out" }, s + 0.22);
  }
  if (!T.isLast) {
    const d = S.durations.out;
    tl.to(gp, { opacity: 0, x: dir * u * 0.6, duration: d, ease: S.ease.exit }, Math.max(T.start + tin, T.start + T.dur - d));
  }
};
</script>
