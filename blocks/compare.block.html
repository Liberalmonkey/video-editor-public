<!--meta
{"name": "compare", "description": "İki sütun karşılaştırma (önce/sonra, X vs Y, yanlış/doğru). Sol önce, sağ sonra gelir; sağ taraf vurgu rengiyle kazanır.",
 "props": {"left_title": "string*", "left_items": "list", "right_title": "string*", "right_items": "list", "vs": "string"},
 "default_dur": 5.0, "sfx": {"in": "swoosh", "extra": [{"at": 1.2, "type": "whoosh", "intensity": "soft"}]}, "tags": ["animation", "explainer", "ugc"]}
-->
<style>
.blk-compare { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: calc(var(--u) * 3);
  padding: calc(var(--safe-t) + var(--u)*8) calc(var(--safe-r) + var(--u)*6) calc(var(--safe-b) + var(--u)*8) calc(var(--safe-l) + var(--u)*6); }
.blk-compare .cp-col { background: var(--c-surface); border-radius: var(--radius); padding: calc(var(--u) * 3.4); min-height: 40%; }
.blk-compare .cp-col.right { outline: calc(var(--u)*0.45) solid var(--c-accent); }
.blk-compare .cp-h { font-size: calc(var(--u) * 5); margin-bottom: calc(var(--u) * 2); }
.blk-compare .cp-col.left .cp-h { color: var(--c-muted); }
.blk-compare .cp-i { font: 600 calc(var(--u) * 3.4) / 1.3 var(--f-body); padding: calc(var(--u) * 0.8) 0; border-top: 1px solid rgba(255,255,255,.08); }
.blk-compare .cp-vs { font: 900 calc(var(--u) * 4) / 1 var(--f-display); color: var(--c-accent); }
</style>
<markup>
<div class="blk blk-compare">
  <div class="cp-col left"><div class="cp-h t-display">{{left_title}}</div><div class="cp-list"></div></div>
  <div class="cp-vs">{{vs}}</div>
  <div class="cp-col right"><div class="cp-h t-display">{{right_title}}</div><div class="cp-list"></div></div>
</div>
</markup>
<script>
HF_BLOCKS["compare"] = function (tl, el, P, T, S) {
  const cols = el.querySelectorAll(".cp-col");
  [[cols[0], P.left_items || []], [cols[1], P.right_items || []]].forEach(function (pair) {
    const list = pair[0].querySelector(".cp-list");
    pair[1].forEach(function (txt) { const d = document.createElement("div"); d.className = "cp-i"; d.textContent = txt; list.appendChild(d); });
  });
  if (!P.vs) el.querySelector(".cp-vs").textContent = "→";
  const half = Math.min(1.2, T.dur * 0.3);
  tl.fromTo(cols[0], { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.45, ease: S.ease.ui }, T.start);
  HF.fadeUp(tl, cols[0].querySelectorAll(".cp-i"), T.start + 0.25, S, { y: 10, stagger: 0.08 });
  HF.pop(tl, el.querySelector(".cp-vs"), T.start + half - 0.15, S);
  tl.fromTo(cols[1], { opacity: 0, x: 40 }, { opacity: 1, x: 0, duration: 0.45, ease: S.ease.ui }, T.start + half);
  HF.fadeUp(tl, cols[1].querySelectorAll(".cp-i"), T.start + half + 0.25, S, { y: 10, stagger: 0.08 });
  tl.to(cols[0], { opacity: 0.55, duration: 0.4, ease: "none" }, T.start + half + 0.2);
  HF.exit(tl, el, T, S);
};
</script>
