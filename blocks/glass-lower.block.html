<!--meta
{"name": "glass-lower", "description": "Kişi tanıtımı, buzlu cam kart: konuşmacının dikey kartının solunda, dikey ortanın altında (y ~%50–70; altyazı bölgesine girmez). Opsiyonel logo üstte açık zeminli karoda; isim maskeyle girer.",
 "props": {"name": "string*", "role": "string", "logo": "image"},
 "default_dur": 3.5, "sfx": {"in": "swoosh"}, "tags": ["glass", "ornek-marka", "footage"]}
-->
<style>
.blk-glass-lower .gl { position: absolute; top: calc(var(--H) * 0.50); right: calc(var(--W) / 2 + var(--card-half) + var(--u) * 3);
  min-width: calc(var(--u) * 26); max-width: min(calc(var(--u) * 38), calc(var(--W) / 2 - var(--card-half) - var(--u) * 3 - var(--safe-l)));
  display: flex; flex-direction: column; align-items: flex-start; gap: calc(var(--u) * 1.2);
  padding: calc(var(--u) * 1.6) calc(var(--u) * 2.8) calc(var(--u) * 2) calc(var(--u) * 1.6);
  background: var(--c-glass); border: 1px solid var(--c-glass-border); border-radius: calc(var(--u) * 2.2);
  -webkit-backdrop-filter: blur(calc(var(--u) * 1.45)) saturate(1.15); backdrop-filter: blur(calc(var(--u) * 1.45)) saturate(1.15);
  box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3.4) rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.10); }
.blk-glass-lower .gl-logo { height: calc(var(--u) * 4.6); padding: calc(var(--u) * 0.8) calc(var(--u) * 1.3);
  background: var(--c-brand-light); border-radius: calc(var(--u) * 1.2); display: flex; align-items: center; }
.blk-glass-lower .gl-logo img { height: 100%; width: auto; display: block; }
.blk-glass-lower .gl-text { padding-left: calc(var(--u) * 0.4); }
.blk-glass-lower .gl-name { font: 600 calc(var(--u) * 3.4) / 1.08 var(--f-display); letter-spacing: -0.02em; color: var(--c-fg);
  white-space: nowrap; text-shadow: 0 1px calc(var(--u) * 0.6) rgba(0,0,0,.2); }
.blk-glass-lower .gl-role { margin-top: calc(var(--u) * 0.5); font: 500 calc(var(--u) * 2) / 1.25 var(--f-body); color: var(--c-fg); opacity: .72; }
</style>
<markup>
<div class="blk blk-glass-lower">
  <div class="gl">
    <div class="gl-logo"><img src="{{logo}}" alt="" /></div>
    <div class="gl-text">
      <div class="gl-name mask"><span>{{name}}</span></div>
      <div class="gl-role mask"><span>{{role}}</span></div>
    </div>
  </div>
</div>
</markup>
<script>
window.GLASS_U = window.GLASS_U || function () {
  return parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--u")) || 14;
};
HF_BLOCKS["glass-lower"] = function (tl, el, P, T, S) {
  const gl = el.querySelector(".gl"), u = GLASS_U();
  if (!P.logo) el.querySelector(".gl-logo").style.display = "none";
  if (!P.role) el.querySelector(".gl-role").style.display = "none";
  const tin = Math.min(0.45, T.dur * 0.3);
  tl.fromTo(gl, { opacity: 0, x: -u * 2.85, filter: "blur(12px)" },
    { opacity: 1, x: 0, filter: "blur(0px)", duration: tin, ease: S.ease.ui }, T.start);
  tl.set(gl, { filter: "none" }, T.start + tin);
  if (P.logo) HF.fadeUp(tl, el.querySelector(".gl-logo"), T.start + 0.1, S, { y: u * 0.6, dur: 0.4 });
  HF.maskIn(tl, [el.querySelector(".gl-name > span"), el.querySelector(".gl-role > span")], T.start + 0.18, S,
    { dur: 0.5, stagger: 0.1 });
  if (!T.isLast) {
    const d = S.durations.out;
    tl.to(gl, { opacity: 0, x: -u * 0.6, duration: d, ease: S.ease.exit }, Math.max(T.start + tin, T.start + T.dur - d));
  }
};
</script>
