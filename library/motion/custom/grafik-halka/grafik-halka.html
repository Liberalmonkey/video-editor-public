<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Halka grafik</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Saat window.seek ile sürülür. Üret: vedit motion kur grafik-halka -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
:root{--u:min(1vw,.9vh)}
.sahne{position:absolute;left:9vw;top:16vh;width:calc(46*var(--u));font-family:var(--font);color:var(--yazi);opacity:0;transform-origin:30% 40%}
.panel{background:var(--zemin);border-radius:var(--kose,18px);padding:calc(4.5*var(--u)) calc(4*var(--u)) calc(4*var(--u));display:flex;flex-direction:column;align-items:center}
.halka{position:relative;width:calc(32*var(--u));height:calc(32*var(--u))}
svg{width:100%;height:100%;transform:rotate(-90deg)}
circle{fill:none;stroke-width:11}
.iz{stroke:var(--soluk);opacity:.25}
.dolu{stroke:var(--vurgu);stroke-linecap:round}
.yuzde{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:calc(8.6*var(--u));font-variant-numeric:tabular-nums;font-family:var(--font-rakam)}
.metin{margin-top:calc(3*var(--u));text-align:center;font-weight:var(--agirlik,800);font-size:calc(4*var(--u));line-height:1.15}
</style></head><body>
<div class="sahne" id="s"><div class="panel">
 <div class="halka"><svg viewBox="0 0 100 100"><circle class="iz" cx="50" cy="50" r="42"/><circle class="dolu" id="d" cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="100"/></svg>
 <div class="yuzde" id="y"></div></div>
 <div class="metin" id="m"></div>
</div></div>
<script>
const P = Object.assign({ deger: 72, metin: "Kullanıcı memnuniyeti" }, window.PARAM);
const V = Math.min(100, Math.max(0, Number(P.deger) || 0));
const m = document.getElementById("m"); m.textContent = P.metin; if (!P.metin) m.style.display = "none";
const k = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 4), ei = x => x * x * x;
const s = document.getElementById("s"), d = document.getElementById("d"), y = document.getElementById("y");
window.seek = t => {
  const gir = eo(k(t, 0, .35)), cik = ei(k(t, 3.0, 3.35)), e = eo(k(t, .3, 1.6));
  s.style.opacity = gir * (1 - cik);
  s.style.transform = `scale(${.9 + .1 * gir - .06 * cik})`;
  d.style.strokeDashoffset = 100 - V * e;
  d.style.opacity = V * e > .3 ? 1 : 0;  // yuvarlak uç sıfırda nokta bırakmasın
  y.textContent = "%" + Math.round(V * e).toLocaleString("tr-TR");
};
seek(0);
</script>
</body></html>
