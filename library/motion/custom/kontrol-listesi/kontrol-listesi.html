<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Kontrol listesi</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Saat window.seek ile sürülür. Üret: vedit motion kur kontrol-listesi -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
:root{--u:min(1vw,.9vh)}
.sahne{position:absolute;left:9vw;top:16vh;width:calc(65*var(--u));font-family:var(--font);color:var(--yazi);opacity:0}
.panel{background:var(--zemin);border-radius:var(--kose,18px);padding:calc(4*var(--u)) calc(4.5*var(--u));box-sizing:border-box}
h1{margin:0 0 calc(3.2*var(--u));font-weight:var(--agirlik,800);font-size:calc(4.6*var(--u));line-height:1.1}
.madde{display:flex;align-items:center;gap:calc(2.6*var(--u));margin-top:calc(2.4*var(--u));opacity:0}
.kutu{flex:none;position:relative;box-sizing:border-box;width:calc(5.6*var(--u));height:calc(5.6*var(--u));border:calc(.5*var(--u)) solid var(--soluk);
  border-radius:min(var(--kose,18px),calc(1.4*var(--u)))}
.dolu{position:absolute;inset:calc(-.5*var(--u));border-radius:inherit;background:var(--vurgu);transform:scale(0)}
.dolu svg{position:absolute;inset:0;width:100%;height:100%}
.dolu path{fill:none;stroke:var(--zemin);stroke-width:12;stroke-linecap:round;stroke-linejoin:round}
.yazi{font-weight:700;font-size:calc(4.2*var(--u));line-height:1.18}
</style></head><body>
<div class="sahne" id="s"><div class="panel" id="p"><h1 id="b"></h1><div id="l"></div></div></div>
<script>
const P = Object.assign({ baslik: "Bugünün planı", maddeler: "İlk adım|İkinci adım|Üçüncü adım" }, window.PARAM);
const M = String(P.maddeler).split("|").map(x => x.trim()).filter(Boolean).slice(0, 4);
const $ = id => document.getElementById(id);
$("b").textContent = P.baslik; if (!P.baslik) $("b").style.display = "none";
const R = M.map(m => {
  const d = document.createElement("div"); d.className = "madde";
  d.innerHTML = '<div class="kutu"><div class="dolu"><svg viewBox="0 0 100 100"><path d="M24 53 L43 71 L77 32" pathLength="1" stroke-dasharray="1"/></svg></div></div><div class="yazi"></div>';
  d.querySelector(".yazi").textContent = m; $("l").appendChild(d);
  return { d, f: d.querySelector(".dolu"), p: d.querySelector("path") };
});
const k = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x;
const geri = x => 1 + 2.2 * Math.pow(x - 1, 3) + 1.2 * Math.pow(x - 1, 2);
const ADIM = Math.min(.65, 2.4 / Math.max(1, R.length));
window.seek = t => {
  const gir = eo(k(t, 0, .4)), cik = ei(k(t, 3.95, 4.35));
  $("s").style.opacity = Math.min(1, gir * 3) * (1 - cik);
  $("s").style.transform = `translateY(calc(${(1 - gir) * 3 - cik * 3}*var(--u)))`;
  $("p").style.clipPath = `inset(0 0 ${(1 - gir) * 100}% 0)`;
  R.forEach((r, i) => {
    const a = .45 + i * ADIM, g = eo(k(t, a, a + .28)), c = k(t, a + .3, a + .52);
    r.d.style.opacity = g;
    r.d.style.transform = `translateX(calc(${(g - 1) * 3}*var(--u)))`;
    r.f.style.transform = `scale(${c ? geri(c) : 0})`;
    r.p.style.strokeDashoffset = 1 - eo(k(t, a + .4, a + .65));
  });
};
seek(0);
</script>
</body></html>
