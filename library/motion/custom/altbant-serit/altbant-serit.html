<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Alt bant şerit</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Üret: vedit motion kur altbant-serit -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
.sahne{position:absolute;left:9vw;bottom:32vh;max-width:65vw;display:flex;align-items:stretch;font-family:var(--font)}
.serit{width:1.6vmin;flex:none;background:var(--vurgu);border-radius:.4vmin;transform-origin:center bottom;
  animation:boy .3s cubic-bezier(.2,.9,.3,1) .05s both,boyKapa .25s ease-in 3.6s both;position:relative;z-index:2}
.kayan{overflow:hidden}
.panel{background:var(--zemin);color:var(--yazi);padding:2.2vmin 3.4vmin 2.4vmin;border-radius:0 var(--kose,18px) var(--kose,18px) 0;
  animation:gir .5s cubic-bezier(.16,1,.3,1) .25s both,cik .35s cubic-bezier(.6,0,.9,.4) 3.3s both}
.ad{display:inline-block;font-weight:var(--agirlik,800);font-size:6.4vmin;line-height:1.1}
.unvan{display:block;margin-top:.8vmin;font-weight:500;font-size:3.8vmin;line-height:1.2;opacity:.8;animation:yan .4s cubic-bezier(.16,1,.3,1) .5s both}
@keyframes boy{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes boyKapa{to{transform:scaleY(0)}}
@keyframes gir{from{transform:translateX(-101%)}to{transform:translateX(0)}}
@keyframes cik{to{transform:translateX(-101%)}}
@keyframes yan{from{transform:translateX(-3vmin);opacity:0}to{transform:translateX(0);opacity:.8}}
</style></head><body>
<div class="sahne"><div class="serit"></div><div class="kayan"><div class="panel"><div><span class="ad" id="ad"></span></div><span class="unvan" id="unvan"></span></div></div></div>
<script>
const P = Object.assign({ ad: "Ad Soyad", unvan: "Unvan" }, window.PARAM);
const ad = document.getElementById("ad"), unvan = document.getElementById("unvan");
ad.textContent = P.ad; unvan.textContent = P.unvan;
if (!P.unvan) unvan.style.display = "none";
// Uzun ad tek satırda küçülür; alt sınırda da sığmazsa satıra bölünür.
function sigdir(el, taban, alt, maxPx) {
  el.style.whiteSpace = "nowrap"; el.style.maxWidth = ""; let f = taban; el.style.fontSize = f + "vmin";
  while (el.getBoundingClientRect().width > maxPx && f > alt) { f -= .1; el.style.fontSize = f + "vmin"; }
  if (el.getBoundingClientRect().width > maxPx) { el.style.whiteSpace = "normal"; el.style.maxWidth = maxPx + "px"; }
}
function kur() {
  const vm = Math.min(innerWidth, innerHeight) / 100, max = innerWidth * .65 - vm * 8.4;
  sigdir(ad, 6.4, 3.6, max); sigdir(unvan, 3.8, 3.2, max);
}
kur();
let hazir = false;
window.seek = () => { if (!hazir) { hazir = true; kur(); } }; // tema ve font yüklendikten sonra bir kez yeniden ölç
</script>
</body></html>
