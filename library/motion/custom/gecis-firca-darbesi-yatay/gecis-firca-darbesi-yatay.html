<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Kuru fırça darbesi geçişi 16:9</title>
<!-- Saydam geçiş (ADR 0036). Ekran sürenin tam ortasında (0,40 sn) tamamen kapalı: kesim oraya konur.
     Zaman window.seek(t) ile sürülür; ilk ve son kare saydam. Renkler temadan. -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{position:absolute;left:0;top:0;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas><script>
const D=0.8;
const c=document.getElementById('c'),x=c.getContext('2d');
const R=(n,v)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||v;
const cl=v=>Math.min(1,Math.max(0,v)), ara=(p,a,b)=>cl((p-a)/(b-a)), lerp=(a,b,u)=>a+(b-a)*u;
const eO=u=>1-Math.pow(1-u,3), eIO=u=>u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
function tohum(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GA=.06,GB=.46,CA=.52,CB=.88;
const GEC=[0,0.14,0.06,0.18,0.10];
let RENK={};
window.seek=t=>{
  if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight}
  const W=c.width,H=c.height;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
  RENK={v:R('--vurgu'),i:R('--ikincil'),z:R('--zemin'),y:R('--yazi')};
  const p=cl(t/D);if(p<=GA||p>=CB)return;ciz(p,W,H);
};

function seritCiz(x0,x1,y0,bh,anaRenk,izRenk1,izRenk2,seed){
  if(x1-x0<8)return;
  const rnd=tohum(seed);
  const segX=16, segY=22;
  const ust=[], alt=[];
  for(let k=0;k<=segX;k++){
    const px=lerp(x0,x1,k/segX);
    const n1=(rnd()-0.5)*18+Math.sin(k*0.9+seed)*8;
    const n2=(rnd()-0.5)*18+Math.cos(k*0.85+seed)*8;
    ust.push([px,y0+n1]);
    alt.push([px,y0+bh+n2]);
  }
  x.beginPath();
  x.moveTo(ust[0][0],ust[0][1]);
  for(let k=1;k<=segX;k++)x.lineTo(ust[k][0],ust[k][1]);
  for(let k=1;k<segY;k++){
    const py=lerp(ust[segX][1],alt[segX][1],k/segY);
    const dis=(k%2===0?1:0.25)*(40+rnd()*130);
    x.lineTo(x1+dis,py+(rnd()-0.5)*6);
  }
  for(let k=segX;k>=0;k--)x.lineTo(alt[k][0],alt[k][1]);
  x.closePath();
  x.fillStyle=anaRenk;
  x.fill();

  for(let b=0;b<8;b++){
    const ry=y0+bh*(0.12+0.76*(b/7))+(rnd()-0.5)*10;
    const rh=6+rnd()*14;
    const bx1=x1-20+rnd()*130;
    if(bx1<=x0+20)continue;
    x.beginPath();
    x.moveTo(x0,ry);
    for(let s=1;s<=6;s++){
      x.lineTo(lerp(x0,bx1,s/6),ry+Math.sin(s*1.3+b)*5+(rnd()-0.5)*5);
    }
    x.lineTo(bx1+rnd()*50,ry+rh*0.5);
    for(let s=6;s>=0;s--){
      x.lineTo(lerp(x0,bx1,s/6),ry+rh+Math.cos(s*1.2+b)*5+(rnd()-0.5)*5);
    }
    x.closePath();
    x.fillStyle=b%2===0?izRenk1:izRenk2;
    x.fill();
  }
}

function ciz(p,W,H){
  if(p>=GB && p<CA){
    x.fillStyle=RENK.z;
    x.fillRect(0,0,W,H);
  }
  const aci=-6*Math.PI/180;
  const padX=Math.ceil(H*Math.sin(Math.abs(aci)))+240;
  const padY=Math.ceil(W*Math.sin(Math.abs(aci)))+160;
  const topY=-padY, totH=H+padY*2, stepY=totH/5, bh=stepY+84;

  x.save();
  x.translate(W/2,H/2);
  x.rotate(aci);
  x.translate(-W/2,-H/2);

  const palet=[
    [RENK.z,RENK.v,RENK.i],
    [RENK.v,RENK.z,RENK.i],
    [RENK.z,RENK.i,RENK.v],
    [RENK.i,RENK.z,RENK.v],
    [RENK.z,RENK.v,RENK.i]
  ];

  for(let i=0;i<5;i++){
    const d=GEC[i];
    let q;
    if(p<GB){
      const u=ara(p,GA,GB);
      q=eO(cl((u-d)/(1-d)));
    }else if(p<CA){
      q=1;
    }else{
      const u=ara(p,CA,CB);
      q=1-eO(cl((u-d)/(1-d)));
    }
    if(q<=0.001)continue;
    const x0=-padX;
    const x1=lerp(-padX,W+padX,q);
    const y0=topY+i*stepY-42;
    const [cAna,cIz1,cIz2]=palet[i];
    seritCiz(x0,x1,y0,bh,cAna,cIz1,cIz2,401+i*53);
  }
  x.restore();
}
window.seek(0);
</script></body></html>
