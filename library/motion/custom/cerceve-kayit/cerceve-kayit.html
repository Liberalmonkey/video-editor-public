<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Kayıt vizörü: kamera kaydı havası</title>
<!-- Proje yapımı saydam çerçeve (ADR 0036). İçi boş: altındaki videonun bir bölümünü çevreler. 0.4 sn giriş, bekleme, 0.3 sn çıkış. -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:1920px;height:1080px}
svg{position:absolute;inset:0;width:1920px;height:1080px}
svg *{transform-box:view-box}
.cik{transform-origin:960px 540px;animation:cik .3s cubic-bezier(.5,0,.75,0) 2.7s both}
@keyframes cik{to{opacity:0;transform:scale(.97)}}
.v{fill:none;stroke:var(--yazi);stroke-width:10;stroke-linecap:round;filter:drop-shadow(0 0 4px rgba(0,0,0,.5));animation:fade .4s ease-out both}
.rec{fill:var(--vurgu);animation:yan 1s steps(1) .1s 3 both}
@keyframes fade{from{opacity:0}}
@keyframes yan{0%{opacity:1}50%{opacity:0}}
</style></head><body>
<svg viewBox="0 0 1920 1080"><g class="cik"><path class="v" d="M90 230 V90 H230"/><path class="v" d="M1690 90 H1830 V230"/><path class="v" d="M1830 850 V990 H1690"/><path class="v" d="M230 990 H90 V850"/><path class="v" d="M935 540 H985 M960 515 V565"/><circle class="rec" cx="170" cy="170" r="22"/></g></svg>
</body></html>
