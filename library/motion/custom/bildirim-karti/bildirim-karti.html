<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Bildirim kartı</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Üret: vedit motion kur bildirim-karti -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
.sahne{position:absolute;left:9vw;top:16vh;width:65vw;font-family:var(--font)}
.kart{display:flex;gap:2.6vmin;align-items:flex-start;max-width:80vmin;box-sizing:border-box;padding:2.6vmin 3vmin;background:var(--zemin);color:var(--yazi);
  border-radius:var(--kose,18px);animation:in .55s cubic-bezier(.16,1,.3,1) .05s both,cik .4s cubic-bezier(.6,0,.9,.4) 2.95s both}
.simge{flex:none;width:9vmin;height:9vmin;border-radius:calc(var(--kose,18px) * .8);background:var(--vurgu);display:grid;place-items:center}
.simge svg{width:5.4vmin;height:5.4vmin;fill:var(--vurgu-ustu,var(--zemin));transform-origin:50% 10%;animation:salla .5s ease-in-out .55s both}
.govde{flex:1;min-width:0}
.ust{display:flex;align-items:baseline;gap:2vmin}
.baslik{flex:1;min-width:0;font-weight:var(--agirlik,800);font-size:4.4vmin;line-height:1.15}
.zaman{flex:none;font-weight:500;font-size:3.2vmin;opacity:.6}
.metin{margin-top:.8vmin;font-weight:500;font-size:3.5vmin;line-height:1.25;opacity:.88}
@keyframes in{from{transform:translateY(-34vh);opacity:0}40%{opacity:1}to{transform:translateY(0);opacity:1}}
@keyframes cik{to{transform:translateY(-34vh);opacity:0}}
@keyframes salla{0%,100%{transform:rotate(0)}25%{transform:rotate(14deg)}50%{transform:rotate(-10deg)}75%{transform:rotate(5deg)}}
</style></head><body>
<div class="sahne"><div class="kart">
  <div class="simge"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5a6.5 6.5 0 0 0-6.5 6.5v4.2L3.6 16.4c-.4.7.1 1.6.9 1.6h15c.8 0 1.3-.9.9-1.6l-1.9-3.2V9A6.5 6.5 0 0 0 12 2.5zM9.4 19.5a2.6 2.6 0 0 0 5.2 0z"/></svg></div>
  <div class="govde"><div class="ust"><div class="baslik" id="baslik"></div><div class="zaman">şimdi</div></div><div class="metin" id="metin"></div></div>
</div></div>
<script>
// Dolgu üstündeki yazı: temanın zemin ve yazı renginden hangisi daha okunaklıysa o (pastel vurgulu açık temada zemin rengi okunmaz).
function zitYazi(dolgu, ad) {
  const p = document.body.appendChild(document.createElement("i"));
  const lum = v => { p.style.color = v; return getComputedStyle(p).color.match(/[\d.]+/g).slice(0, 3)
    .map(c => (c /= 255) <= .03928 ? c / 12.92 : ((c + .055) / 1.055) ** 2.4).reduce((s, c, i) => s + c * [.2126, .7152, .0722][i], 0); };
  const k = (a, b) => (Math.max(a, b) + .05) / (Math.min(a, b) + .05);
  const d = lum(dolgu), z = lum("var(--zemin)"), y = lum("var(--yazi)"); p.remove();
  document.documentElement.style.setProperty(ad, k(d, z) >= k(d, y) ? "var(--zemin)" : "var(--yazi)");
}
const P = Object.assign({ baslik: "Yeni mesaj", metin: "Bildirim satırı buraya gelir" }, window.PARAM);
const b = document.getElementById("baslik"), mt = document.getElementById("metin");
b.textContent = P.baslik; mt.textContent = P.metin;
if (!P.metin) mt.style.display = "none";
// Başlık uzunsa küçülür; satır kart genişliğinde satıra bölünür.
b.style.fontSize = Math.max(3.8, Math.min(4.4, 4.4 * 16 / Math.max(16, P.baslik.length))) + "vmin";
let hazir = false;
window.seek = () => { if (!hazir) { hazir = true; zitYazi("var(--vurgu)", "--vurgu-ustu"); } }; // tema yüklendikten sonra
</script>
</body></html>
