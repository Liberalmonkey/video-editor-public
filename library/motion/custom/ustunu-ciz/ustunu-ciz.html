<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Üstünü çiz</title>
<!-- Proje yapımı saydam motion (ADR 0031). "Bu değil" anı. Render: vedit pano <bu dosya> --sure 1.6 --w 1080 --h 1080 -o ustunu-ciz.webm -->
<style>
html,body{margin:0;background:transparent}
svg{position:absolute;inset:0;width:1080px;height:1080px}
path{fill:none;stroke:var(--olumsuz);stroke-width:26;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.a{animation:ciz .25s cubic-bezier(.16,1,.3,1) .05s both}
.b{animation:ciz .25s cubic-bezier(.16,1,.3,1) .28s both}
g{animation:sol .25s var(--ease-cik) 1.2s both}
@keyframes ciz{to{stroke-dashoffset:0}}
@keyframes sol{to{opacity:0}}
</style></head><body>
<svg viewBox="0 0 1080 1080"><g>
<path class="a" pathLength="1" d="M300 300 C 460 470, 620 620, 780 790"/>
<path class="b" pathLength="1" d="M790 290 C 640 450, 470 630, 290 800"/>
</g></svg>
</body></html>
