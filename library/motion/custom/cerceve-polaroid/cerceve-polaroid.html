<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Polaroid çerçeve: anı fotoğrafı</title>
<!-- Proje yapımı saydam çerçeve (ADR 0036). İçi boş: altındaki videonun bir bölümünü çevreler. 0.4 sn giriş, bekleme, 0.3 sn çıkış. -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:1080px;height:1080px}
svg{position:absolute;inset:0;width:1080px;height:1080px}
svg *{transform-box:view-box}
.cik{transform-origin:540px 540px;animation:cik .3s cubic-bezier(.5,0,.75,0) 2.7s both}
@keyframes cik{to{opacity:0;transform:scale(.97)}}
.p{fill:var(--yazi);fill-rule:evenodd;filter:drop-shadow(0 14px 22px rgba(0,0,0,.4));transform-origin:540px 540px;animation:gel .4s cubic-bezier(.2,.9,.3,1) both}
@keyframes gel{from{opacity:0;transform:translateY(-70px) rotate(-9deg)}to{opacity:1;transform:translateY(0) rotate(-3deg)}}
</style></head><body>
<svg viewBox="0 0 1080 1080"><g class="cik"><path class="p" d="M235 140 H845 V940 H235 Z M275 180 V780 H805 V180 Z"/></g></svg>
</body></html>
