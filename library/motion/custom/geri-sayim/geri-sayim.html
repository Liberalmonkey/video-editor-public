<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Geri sayım</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Saat window.seek ile sürülür. Üret: vedit motion kur geri-sayim -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
:root{--u:min(1vw,.9vh)}
.sahne{position:absolute;left:9vw;top:16vh;width:calc(65*var(--u));display:flex;flex-direction:column;align-items:center;font-family:var(--font);opacity:0}
.kutu{position:relative;width:calc(36*var(--u));height:calc(36*var(--u));background:var(--zemin);border-radius:var(--kose,18px)}
svg{position:absolute;inset:calc(3*var(--u));width:calc(30*var(--u));height:calc(30*var(--u));transform:rotate(-90deg) scaleY(-1)}
.iz{fill:none;stroke:var(--soluk);stroke-width:3.5;opacity:.25}
.kalan{fill:none;stroke:var(--vurgu);stroke-width:3.5;stroke-linecap:round}
.rakam{font-family:var(--font-rakam);position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--yazi);font-weight:900;font-size:calc(19*var(--u));line-height:1}
.metin{margin-top:calc(2.6*var(--u));padding:.3em .8em;background:var(--vurgu);color:var(--vurgu-ustu);border-radius:99px;
  font-weight:800;font-size:calc(4.4*var(--u));white-space:nowrap;opacity:0}
</style></head><body>
<div class="sahne" id="s"><div class="kutu"><svg viewBox="0 0 100 100"><circle class="iz" cx="50" cy="50" r="46"/>
<circle class="kalan" id="h" cx="50" cy="50" r="46" pathLength="100" stroke-dasharray="100"/></svg>
<div class="rakam" id="r"></div></div><div class="metin" id="m"></div></div>
<script>
const P = Object.assign({ metin: "Başlıyoruz" }, window.PARAM);
const $ = id => document.getElementById(id);
$("m").textContent = P.metin; if (!P.metin) $("m").style.display = "none";
const k = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x;
const BAS = .2, ADIM = .8;  // 3: .2-1.0, 2: 1.0-1.8, 1: 1.8-2.6
window.seek = t => {
  const gir = eo(k(t, 0, .3)), cik = ei(k(t, 2.62, 2.95));
  $("s").style.opacity = gir * (1 - cik);
  $("s").style.transform = `scale(${.86 + .14 * gir - .1 * cik})`;
  const i = Math.min(2, Math.max(0, Math.floor((t - BAS) / ADIM))), a = BAS + i * ADIM, f = k(t, a, a + ADIM);
  $("r").textContent = 3 - i;
  const g = eo(k(t, a, a + .2)), son = i < 2 ? ei(k(t, a + ADIM - .12, a + ADIM)) : 0;
  $("r").style.opacity = (t < BAS ? 0 : g) * (1 - son);
  $("r").style.transform = `scale(${1.35 - .35 * g - .15 * son})`;
  $("h").style.strokeDashoffset = 100 * f;  // her rakamda halka tükenir
  $("m").style.opacity = eo(k(t, .3, .6));
};
seek(0);
</script>
</body></html>
