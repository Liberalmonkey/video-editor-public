<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Sayı rozeti</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Saat window.seek ile sürülür. Üret: vedit motion kur sayi-rozeti -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
:root{--u:min(1vw,.9vh)}
.sahne{position:absolute;left:9vw;top:16vh;max-width:calc(65*var(--u));font-family:var(--font);color:var(--yazi)}
.panel{display:inline-block;background:var(--zemin);border-radius:var(--kose,18px);padding:calc(3.4*var(--u)) calc(5*var(--u)) calc(4*var(--u))}
.sayi{font-weight:800;line-height:1;font-variant-numeric:tabular-nums;font-family:var(--font-rakam);white-space:nowrap;letter-spacing:-.02em}
#d{text-align:right}
.sonek{color:var(--vurgu)}
.cizgi{height:var(--cizgi,10px);min-height:4px;width:calc(16*var(--u));margin:calc(2.2*var(--u)) 0 calc(2*var(--u));background:var(--vurgu);border-radius:99px;transform-origin:left}
.metin{font-weight:700;font-size:calc(4.2*var(--u));line-height:1.15;max-width:calc(55*var(--u))}
</style></head><body>
<div class="sahne"><div class="panel" id="p"><div class="sayi" id="n"><span id="o"></span><span id="d"></span><span class="sonek" id="x"></span></div>
<div class="cizgi" id="c"></div><div class="metin" id="m"></div></div></div>
<script>
const P = Object.assign({ deger: 1250, onek: "", sonek: "+", metin: "Yeni abone bu hafta" }, window.PARAM);
const V = Math.round(Math.min(999999, Math.max(0, Number(P.deger) || 0)));
const $ = id => document.getElementById(id), tr = v => v.toLocaleString("tr-TR");
$("o").textContent = P.onek; $("x").textContent = P.sonek; $("m").textContent = P.metin;
if (!P.metin) { $("m").style.display = "none"; }
const uz = (P.onek + tr(V) + P.sonek).length;
$("n").style.fontSize = `calc(${Math.min(15, 15 * 6.5 / uz)}*var(--u))`;  // 6 karakterden uzun sayı küçülür, panel güvenli alanı aşmaz
const k = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3), ex = x => x >= 1 ? 1 : 1 - Math.pow(2, -9 * x), ei = x => x * x;
window.seek = t => {
  const gir = eo(k(t, 0, .35)), cik = ei(k(t, 2.55, 2.9));
  // Genişlik son değere sabit: sayarken panel titremez.
  $("d").style.display = "inline-block"; $("d").style.minWidth = ""; $("d").textContent = tr(V);
  $("d").style.minWidth = $("d").getBoundingClientRect().width + "px";
  $("d").textContent = tr(Math.round(V * ex(k(t, .2, 1.5))));
  $("p").style.clipPath = `inset(0 ${(1 - gir + cik) * 100}% 0 0)`;
  $("p").style.transform = `translateX(calc(${(gir - 1) * 5}*var(--u)))`;
  $("c").style.transform = `scaleX(${eo(k(t, .9, 1.4))})`;
  $("m").style.opacity = eo(k(t, .35, .7));
};
seek(0);
</script>
</body></html>
