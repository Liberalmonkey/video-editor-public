<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>AI kenarlık</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Üret: vedit motion kur ai-kenarlik -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
.sahne{position:absolute;inset:0;width:100vw;height:100vh;pointer-events:none;font-family:var(--font)}
.svg-kapsayici{position:absolute;inset:0;width:100%;height:100%}
.rozet{position:absolute;left:50%;top:14vh;transform:translate(-50%,0);background:var(--zemin);border-radius:99px;padding:2vh 4.5vw;border:2.5px solid var(--vurgu);display:flex;align-items:center;gap:2vw;box-shadow:var(--golge);box-sizing:border-box}
.nokta{width:1.8vmin;height:1.8vmin;background:var(--vurgu);border-radius:50%;box-shadow:0 0 12px var(--vurgu)}
.etiket{color:var(--yazi);font-weight:700;font-size:3.2vmin;letter-spacing:-.01em;white-space:nowrap}
</style></head><body>
<div class="sahne" id="sahne">
 <svg class="svg-kapsayici" id="svg" viewBox="0 0 1080 1920" preserveAspectRatio="none">
  <defs>
   <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:var(--vurgu)"/>
    <stop offset="50%" style="stop-color:var(--ikincil)"/>
    <stop offset="100%" style="stop-color:var(--vurgu)"/>
   </linearGradient>
   <filter id="isik" x="-20%" y="-20%" width="140%" height="140%">
    <feGaussianBlur stdDeviation="7" result="blur1"/>
    <feGaussianBlur stdDeviation="3" result="blur2"/>
    <feMerge>
     <feMergeNode in="blur1"/>
     <feMergeNode in="blur2"/>
     <feMergeNode in="SourceGraphic"/>
    </feMerge>
   </filter>
  </defs>
  <!-- İç yumuşak gradyan çerçevesi -->
  <rect id="cerceve" x="56" y="56" width="968" height="1808" rx="42" ry="42" fill="none" stroke="url(#grad1)" stroke-width="8" vector-effect="non-scaling-stroke" filter="url(#isik)"/>
 </svg>
 <div class="rozet" id="rozet">
  <div class="nokta" id="nokta"></div>
  <div class="etiket" id="etiket"></div>
 </div>
</div>
<script>
const P = Object.assign({ etiket: "Yapay Zekâ Dinliyor..." }, window.PARAM);
const $ = id => document.getElementById(id);
$("etiket").textContent = P.etiket;

const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const easeOutCubic = x => 1 - Math.pow(1 - x, 3);
const easeInCubic = x => x * x * x;

window.seek = t => {
  const s = $("sahne"), c = $("cerceve"), r = $("rozet"), n = $("nokta");

  // sure: 4.0 sn, son kare boş biter (ADR 0036)
  if (t <= 0 || t >= 3.92) {
    s.style.display = "none";
    return;
  }
  s.style.display = "block";

  // Giriş: 0.05..0.38
  const giris = easeOutCubic(clamp((t - 0.05) / 0.33, 0, 1));
  // Çıkış: 3.60..3.90 (kısa; denetim 2026-11-19)
  const cikis = easeInCubic(clamp((t - 3.6) / 0.3, 0, 1));

  const anaOpaklik = (giris * (1 - cikis)).toFixed(3);
  s.style.opacity = anaOpaklik;

  // Nefes alma etkisi (sinüzoidal yumuşak darbe): 0.38..2.65
  const nefes = (Math.sin((t - 0.38) * Math.PI * 1.8) + 1) / 2; // 0..1 arası
  
  // Çerçeve kalınlığı ve parlaklığı nefes alır
  const kalinlik = (6 + nefes * 6).toFixed(1);
  c.setAttribute("stroke-width", kalinlik);
  c.style.opacity = (0.70 + 0.30 * nefes).toFixed(3);

  // Rozet nefes alma ve hafif ölçek
  const rScale = (0.94 + 0.06 * giris + 0.03 * nefes - 0.10 * cikis).toFixed(3);
  r.style.transform = `translate(-50%, 0) scale(${rScale})`;

  // Nokta yanıp sönme
  n.style.opacity = (0.5 + 0.5 * nefes).toFixed(2);
  n.style.transform = `scale(${(0.85 + 0.3 * nefes).toFixed(2)})`;
};

seek(0);
</script>
</body></html>
