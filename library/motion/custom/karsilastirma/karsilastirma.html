<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Karşılaştırma</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Saat window.seek ile sürülür. Üret: vedit motion kur karsilastirma -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
:root{--u:min(1vw,.9vh)}
.sahne{position:absolute;left:9vw;top:16vh;width:calc(65*var(--u));display:flex;gap:calc(2.6*var(--u));font-family:var(--font)}
.kart{flex:1;min-width:0;box-sizing:border-box;padding:calc(3*var(--u));border-radius:var(--kose,18px);opacity:0}
.sol{background:var(--zemin);color:var(--soluk)}
.sag{flex:1.1;background:var(--vurgu);color:var(--vurgu-ustu)}
.ust{display:inline-block;margin-bottom:calc(2.4*var(--u));padding:.25em .6em;border-radius:99px;font-weight:800;font-size:calc(3.2*var(--u));letter-spacing:.06em}
.sol .ust{border:calc(.35*var(--u)) solid var(--soluk)}
.sag .ust{background:var(--zemin);color:var(--yazi)}
.metin{font-weight:700;font-size:calc(3.8*var(--u));line-height:1.18;overflow-wrap:normal}
.sag .metin{font-weight:var(--agirlik,800)}
</style></head><body>
<div class="sahne"><div class="kart sol" id="l"><div class="ust" id="lu"></div><div class="metin" id="lm"></div></div>
<div class="kart sag" id="r"><div class="ust" id="ru"></div><div class="metin" id="rm"></div></div></div>
<script>
const P = Object.assign({ sol_baslik: "Önce", sol: "Saatlerce elle kurgu", sag_baslik: "Sonra", sag: "Dakikalar içinde hazır video" }, window.PARAM);
const $ = id => document.getElementById(id);
$("lu").textContent = P.sol_baslik.toLocaleUpperCase("tr-TR"); $("lm").textContent = P.sol;
$("ru").textContent = P.sag_baslik.toLocaleUpperCase("tr-TR"); $("rm").textContent = P.sag;
const k = (t, a, b) => Math.min(1, Math.max(0, (t - a) / (b - a)));
const eo = x => 1 - Math.pow(1 - x, 3), ei = x => x * x;
// Kelime karta sığmazsa yazı 30 px tabanına kadar küçülür; yine sığmazsa son çare olarak bölünür.
let sigdi = false;
const sigdir = () => ["lm", "rm"].forEach(id => {
  const e = $(id); let f = 3.8; e.style.fontSize = ""; e.style.overflowWrap = "";
  while (e.scrollWidth > e.clientWidth && f > 2.8) { f -= .2; e.style.fontSize = `calc(${f}*var(--u))`; }
  if (e.scrollWidth > e.clientWidth) e.style.overflowWrap = "anywhere";
});
window.seek = t => {
  if (!sigdi) { sigdir(); sigdi = document.fonts.status === "loaded"; }
  const cik = ei(k(t, 3.5, 3.85));
  [["l", .05], ["r", .6]].forEach(([id, a]) => {
    const g = eo(k(t, a, a + .4));
    $(id).style.opacity = Math.min(1, g * 2.5) * (1 - cik);
    $(id).style.transform = `translateY(calc(${(1 - g) * 5 + cik * 3}*var(--u)))`;
    $(id).style.clipPath = `inset(${(1 - g) * 100}% 0 0 0)`;
  });
  // Sol kart, sağ geldikçe geri çekilir: soluk olan geçmiş.
  $("l").style.filter = `saturate(${1 - .6 * eo(k(t, .6, 1.0))})`;
  $("l").style.opacity *= 1 - .3 * eo(k(t, .6, 1.0));
};
seek(0);
</script>
</body></html>
