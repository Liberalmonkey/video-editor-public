<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Alt çizgi</title>
<!-- Proje yapımı saydam motion (ADR 0031). Render: vedit pano <bu dosya> --sure 1.6 --w 1080 --h 1080 -o alt-cizgi.webm -->
<style>
html,body{margin:0;background:transparent}
svg{position:absolute;inset:0;width:1080px;height:1080px}
path{fill:none;stroke:var(--vurgu);stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1}
.a{stroke-width:20;animation:ciz .4s cubic-bezier(.16,1,.3,1) .05s both}
.b{stroke-width:12;animation:ciz .35s cubic-bezier(.16,1,.3,1) .3s both}
g{animation:sol .3s ease-in 1.3s both}
@keyframes ciz{to{stroke-dashoffset:0}}
@keyframes sol{to{opacity:0}}
</style></head><body>
<svg viewBox="0 0 1080 1080"><g>
<path class="a" pathLength="1" d="M150 560 C 380 530, 700 528, 930 548"/>
<path class="b" pathLength="1" d="M260 596 C 480 578, 700 580, 860 590"/>
</g></svg>
</body></html>
