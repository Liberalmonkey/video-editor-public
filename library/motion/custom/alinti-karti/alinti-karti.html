<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Alıntı kartı</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Üret: vedit motion kur alinti-karti -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
.sahne{position:absolute;left:9vw;top:20vh;width:65vw;font-family:var(--font)}
.kart{background:var(--zemin);color:var(--yazi);border-radius:var(--kose,18px);padding:3.6vmin 4.4vmin 4vmin;box-sizing:border-box;
  animation:gir .45s cubic-bezier(.16,1,.3,1) .05s both,cik .4s cubic-bezier(.6,0,.9,.4) 3.95s both}
svg{display:block;width:12vmin;height:9vmin;margin-bottom:1.6vmin;overflow:visible}
.kuyruk{fill:none;stroke:var(--vurgu);stroke-width:11;stroke-linecap:round;stroke-dasharray:1;animation:ciz .4s cubic-bezier(.45,0,.2,1) .25s both}
.top{fill:var(--vurgu);transform-box:fill-box;transform-origin:center;animation:top .3s cubic-bezier(.2,1.4,.4,1) .5s both}
.k2{animation-delay:.38s}.t2{animation-delay:.62s}
.metin{font-weight:600;line-height:1.3}
.satir{overflow:hidden}
.ic{display:inline-block;white-space:nowrap;animation:yuksel .5s cubic-bezier(.16,1,.3,1) both}
.kaynak{display:flex;align-items:center;gap:1.6vmin;margin-top:2.4vmin;font-weight:700;font-size:3.6vmin;opacity:.85;animation:kay .45s cubic-bezier(.16,1,.3,1) both}
.kaynak::before{content:"";width:5vmin;height:max(var(--cizgi,10px),.5vmin);background:var(--vurgu);border-radius:99px;flex:none}
@keyframes gir{from{transform:translateY(4vmin);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes cik{to{transform:translateY(-4vmin);opacity:0}}
@keyframes ciz{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes top{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes yuksel{from{transform:translateY(105%)}to{transform:translateY(0)}}
@keyframes kay{from{transform:translateX(-3vmin);opacity:0}to{transform:translateX(0);opacity:.85}}
</style></head><body>
<div class="sahne"><div class="kart">
  <svg viewBox="0 0 120 90" aria-hidden="true">
    <path class="kuyruk" pathLength="1" d="M12 62 C10 36 22 18 44 10"/><circle class="top" cx="28" cy="64" r="17"/>
    <path class="kuyruk k2" pathLength="1" d="M68 62 C66 36 78 18 100 10"/><circle class="top t2" cx="84" cy="64" r="17"/>
  </svg>
  <div class="metin" id="metin"></div><div class="kaynak" id="kaynak"></div>
</div></div>
<script>
const P = Object.assign({ metin: "Alıntı metni buraya gelir, satır satır okunur.", kaynak: "Kaynak" }, window.PARAM);
const m = document.getElementById("metin"), kaynak = document.getElementById("kaynak");
kaynak.textContent = P.kaynak;
if (!P.kaynak) kaynak.style.display = "none";
// Satırlar tarayıcının kırdığı yerden bulunur, sonra her satır sırayla gelir. Uzun alıntı küçülür.
function kur() {
  m.innerHTML = "";
  m.style.fontSize = Math.max(3.6, Math.min(5.8, 5.8 * Math.sqrt(36 / Math.max(1, P.metin.length)))) + "vmin";
  const sp = P.metin.split(/\s+/).filter(Boolean).map(k => { const s = document.createElement("span"); s.textContent = k + " "; m.appendChild(s); return s; });
  const satirlar = []; let ust = null;
  for (const s of sp) { if (s.offsetTop !== ust) { satirlar.push(""); ust = s.offsetTop; } satirlar[satirlar.length - 1] += s.textContent; }
  m.innerHTML = "";
  satirlar.forEach((st, i) => {
    const d = document.createElement("div"); d.className = "satir";
    const ic = document.createElement("span"); ic.className = "ic"; ic.textContent = st.trim();
    ic.style.animationDelay = (.7 + i * .14) + "s"; d.appendChild(ic); m.appendChild(d);
  });
  kaynak.style.animationDelay = (.8 + satirlar.length * .14) + "s";
}
kur();
let hazir = false;
window.seek = () => { if (!hazir) { hazir = true; kur(); } }; // tema ve font yüklendikten sonra satırları yeniden kır
</script>
</body></html>
