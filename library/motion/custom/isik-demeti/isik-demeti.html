<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Işık Demeti</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Üret: vedit motion kur isik-demeti -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh;font-family:var(--font)}
.sahne{position:absolute;inset:0;width:1080px;height:1080px;display:flex;align-items:center;justify-content:center;
  animation:sahne-gir .45s cubic-bezier(.16,1,.3,1) .05s both,sahne-cik .45s cubic-bezier(.7,0,.84,0) 3.5s both}

.kapsayici{position:relative;width:960px;height:520px}

/* SVG Bağlantı Yolu */
.baglanti-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.yol-taban{fill:none;stroke:var(--soluk);stroke-opacity:.25;stroke-width:4px;stroke-dasharray:8 8}
.yol-isik{fill:none;stroke:url(#isikGrad);stroke-width:10px;stroke-linecap:round;
  filter:drop-shadow(0 0 8px var(--vurgu));
  stroke-dasharray:.25 1.25;stroke-dashoffset:.25;
  animation:ak 1.8s cubic-bezier(.4,0,.2,1) 0.8s both}

/* Sol ve Sağ Kartlar */
.kart{position:absolute;top:180px;width:300px;height:160px;background:var(--zemin);border-radius:var(--kose,20px);
  border:2px solid color-mix(in srgb,var(--yazi) 12%,transparent);box-sizing:border-box;padding:24px 20px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;text-align:center;color:var(--yazi);
  box-shadow:var(--golge);transform-origin:center center}

.kart-sol{left:10px;animation:kart-sol-gir .5s cubic-bezier(.16,1,.3,1) .1s both}
.kart-sag{right:10px;animation:kart-sag-gir .5s cubic-bezier(.16,1,.3,1) .2s both,kart-sag-parla .7s ease-out 2.4s both}

.kart-etiket{font-size:36px;font-weight:var(--agirlik,800);line-height:1.2;color:var(--yazi);word-break:break-word}
.kart-nokta{width:12px;height:12px;border-radius:50%;background:var(--vurgu);margin-bottom:10px}

@keyframes sahne-gir{from{opacity:0}to{opacity:1}}
@keyframes sahne-cik{to{opacity:0;transform:scale(.96)}}
@keyframes kart-sol-gir{from{opacity:0;transform:translateX(-30px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes kart-sag-gir{from{opacity:0;transform:translateX(30px) scale(.9)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes ak{
  0%{stroke-dashoffset:.25;opacity:1}
      100%{stroke-dashoffset:-1;opacity:1}
}
@keyframes kart-sag-parla{
  0%{border-color:color-mix(in srgb,var(--yazi) 12%,transparent);box-shadow:var(--golge)}
  35%{border-color:var(--vurgu);box-shadow:0 0 18px var(--vurgu);transform:scale(1.03)}
  100%{border-color:color-mix(in srgb,var(--yazi) 12%,transparent);box-shadow:var(--golge);transform:scale(1)}
}
</style></head><body>
<div class="sahne">
  <div class="kapsayici">
    <svg class="baglanti-svg" viewBox="0 0 960 520">
      <defs>
        <linearGradient id="isikGrad" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:var(--vurgu)" stop-opacity="0"/>
          <stop offset="35%" style="stop-color:var(--vurgu)" stop-opacity="0.8"/>
          <stop offset="70%" style="stop-color:var(--ikincil)" stop-opacity="1"/>
          <stop offset="100%" style="stop-color:var(--yazi)" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <!-- Sol kart x:310 y:260 -> Sağ kart x:650 y:260 -->
      <path class="yol-taban" d="M 310 260 C 440 130, 520 390, 650 260"/>
      <path class="yol-isik" pathLength="1" d="M 310 260 C 440 130, 520 390, 650 260"/>
    </svg>
    <div class="kart kart-sol">
      <div class="kart-nokta"></div>
      <div class="kart-etiket" id="sol"></div>
    </div>
    <div class="kart kart-sag">
      <div class="kart-nokta" style="background:var(--ikincil)"></div>
      <div class="kart-etiket" id="sag"></div>
    </div>
  </div>
</div>
<script>
const P = Object.assign({ sol: "Kaynak", sag: "Hedef" }, window.PARAM);
const solEl = document.getElementById("sol"), sagEl = document.getElementById("sag");
solEl.textContent = P.sol; sagEl.textContent = P.sag;

function sigdir(el, taban, alt, maxPx) {
  el.style.whiteSpace = "nowrap"; let f = taban; el.style.fontSize = f + "px";
  while (el.getBoundingClientRect().width > maxPx && f > alt) { f -= 1; el.style.fontSize = f + "px"; }
  if (el.getBoundingClientRect().width > maxPx) { el.style.whiteSpace = "normal"; }
}
function kur() {
  sigdir(solEl, 36, 30, 260);
  sigdir(sagEl, 36, 30, 260);
}
kur();
let hazir = false;
window.seek = () => { if (!hazir) { hazir = true; kur(); } };
</script>
</body></html>
