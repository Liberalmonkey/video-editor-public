<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Terminal akışı</title>
<!-- Proje yapımı parametrik motion şablonu (ADR 0036). Sanal saat window.seek ile sürülür. Üret: vedit motion kur terminal-akisi -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:1080px;height:1080px;font-family:var(--font-mono)}
.sahne{position:absolute;left:100px;top:310px;width:880px;box-sizing:border-box;opacity:0}
.pencere{background:var(--zemin);border-radius:var(--kose,18px);border:2px solid color-mix(in srgb,var(--yazi) 12%,transparent);box-sizing:border-box;box-shadow:var(--golge);overflow:hidden}
.ust-bar{height:58px;background:color-mix(in srgb,var(--yazi) 4%,transparent);border-bottom:1.5px solid color-mix(in srgb,var(--yazi) 8%,transparent);display:flex;align-items:center;padding:0 24px;position:relative}
.noktalar{display:flex;align-items:center;gap:10px}
.nokta{width:16px;height:16px;border-radius:50%}
.nokta-kirmizi{background:var(--olumsuz)}
.nokta-sari{background:var(--ikincil)}
.nokta-yesil{background:var(--olumlu)}
.baslik{position:absolute;left:0;right:0;text-align:center;font-size:30px;font-weight:700;color:var(--soluk);pointer-events:none}
.govde{padding:36px 40px;box-sizing:border-box;display:flex;flex-direction:column;gap:18px;min-height:280px}
.satir{font-size:32px;font-weight:600;line-height:1.4;display:flex;align-items:center;flex-wrap:wrap;color:var(--yazi)}
.prompt{color:var(--vurgu);font-weight:800;margin-right:14px;flex:none}
.komut-yazi{color:var(--yazi);font-weight:700}
.imlec{display:inline-block;width:16px;height:34px;background:var(--vurgu);margin-left:6px;vertical-align:middle;border-radius:2px}
.cikti-satir{font-size:31px;font-weight:600;color:var(--ikincil);opacity:0;transform:translateY(8px)}
.cikti-satir.ikinci{color:var(--yazi);opacity:0}
.alt-prompt{opacity:0}
</style></head><body>
<div class="sahne" id="sahne">
 <div class="pencere">
  <div class="ust-bar">
   <div class="noktalar">
    <div class="nokta nokta-kirmizi"></div>
    <div class="nokta nokta-sari"></div>
    <div class="nokta nokta-yesil"></div>
   </div>
   <div class="baslik" id="baslik"></div>
  </div>
  <div class="govde">
   <div class="satir" id="satirKomut">
    <span class="prompt">$</span>
    <span class="komut-yazi" id="komut"></span>
    <span class="imlec" id="imlec"></span>
   </div>
   <div class="satir cikti-satir" id="cikti1"></div>
   <div class="satir cikti-satir ikinci" id="cikti2"></div>
   <div class="satir alt-prompt" id="altPrompt">
    <span class="prompt">$</span>
    <span class="imlec" id="altImlec"></span>
   </div>
  </div>
 </div>
</div>
<script>
const P = Object.assign({
  baslik: "bash ~ video",
  komut: "vedit final --hizli --ses",
  cikti1: "-> Ses miksi ve render tamamlandı",
  cikti2: "-> 60 fps teslim hazır (1080x1080)"
}, window.PARAM);

const $ = id => document.getElementById(id);
$("baslik").textContent = P.baslik;
$("cikti1").textContent = P.cikti1;
$("cikti2").textContent = P.cikti2;

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const easeOut = x => 1 - Math.pow(1 - x, 3);

window.seek = t => {
  // Toplam süre 4.5 sn
  // Giriş: 0.0 - 0.35s
  // Çıkış: 4.0 - 4.45s; 4.45+ tamamen boş (saydam)
  if (t >= 4.45) {
    $("sahne").style.opacity = "0";
    return;
  }

  const gir = easeOut(clamp(t / 0.35, 0, 1));
  const cik = clamp((t - 4.0) / 0.45, 0, 1);
  const cikE = cik * cik;

  const sahne = $("sahne");
  sahne.style.opacity = String(gir * (1 - cikE));
  const translateYGir = (1 - gir) * 35;
  const translateYCik = cikE * -25;
  sahne.style.transform = `translateY(${translateYGir + translateYCik}px) scale(${0.96 + gir * 0.04 - cikE * 0.04})`;

  // Daktilo süreci (0.45s - 1.95s)
  const komutMetin = String(P.komut || "");
  const komutSuresi = 1.5;
  const daktiloIlerleme = clamp((t - 0.45) / komutSuresi, 0, 1);
  const gorunenHarf = Math.floor(daktiloIlerleme * komutMetin.length);
  $("komut").textContent = komutMetin.slice(0, gorunenHarf);

  // İmleç kuralı: "imleç yazarken sabit durduğunda yanıp söner."
  // t < 0.45: duruyor -> yanıp söner
  // 0.45 <= t < 1.95: yazıyor -> sabit yanar (opacity 1)
  // t >= 1.95: yazma bitti -> yanıp söner (t >= 2.9s sonrası alt satıra geçer)
  const imlec = $("imlec");
  const altPrompt = $("altPrompt");
  const altImlec = $("altImlec");

  if (t < 0.45) {
    const flash = Math.floor(t * 3.5) % 2 === 0;
    imlec.style.opacity = flash ? "1" : "0";
  } else if (t < 1.95) {
    imlec.style.opacity = "1"; // yazarken sabit
  } else if (t < 2.9) {
    const flash = Math.floor((t - 1.95) * 4) % 2 === 0;
    imlec.style.opacity = flash ? "1" : "0";
  } else {
    // İmleç alt satıra geçti
    imlec.style.display = "none";
  }

  // Çıktı 1 gelişi: 2.1s - 2.35s
  const c1 = clamp((t - 2.1) / 0.25, 0, 1);
  $("cikti1").style.opacity = String(easeOut(c1));
  $("cikti1").style.transform = `translateY(${(1 - easeOut(c1)) * 10}px)`;

  // Çıktı 2 gelişi: 2.7s - 2.95s
  const c2 = clamp((t - 2.7) / 0.25, 0, 1);
  $("cikti2").style.opacity = String(easeOut(c2));
  $("cikti2").style.transform = `translateY(${(1 - easeOut(c2)) * 10}px)`;

  // Alt prompt belirmesi: 3.1s sonrası
  if (t >= 3.1) {
    altPrompt.style.opacity = "1";
    const flashAlt = Math.floor((t - 3.1) * 3.5) % 2 === 0;
    altImlec.style.opacity = flashAlt ? "1" : "0";
  } else {
    altPrompt.style.opacity = "0";
  }
};

window.seek(0);
</script>
</body></html>
