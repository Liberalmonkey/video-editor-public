<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Kıvrık ok</title>
<!-- Proje yapımı saydam motion (ADR 0036). Render: vedit motion kur ok-kivrik -->
<style>
html,body{margin:0;background:transparent;overflow:hidden}
svg{position:absolute;inset:0;width:1080px;height:1080px;overflow:visible}
.c{fill:none;stroke:var(--vurgu);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.d{fill:var(--vurgu)}
.ciz{stroke-dasharray:1;stroke-dashoffset:1}
@keyframes ciz{to{stroke-dashoffset:0}}
.g1{animation:ciz .7s cubic-bezier(.45,.05,.3,1) .05s both}
.g2{animation:ciz .22s cubic-bezier(.16,1,.3,1) .72s both}
g{animation:cik .3s ease-in 1.35s both}
@keyframes cik{to{opacity:0;transform:translate(-14px,14px)}}
</style></head><body>
<svg viewBox="0 0 1080 1080"><g>
<path class="c ciz g1" pathLength="1" d="M760 260 C 860 380, 760 520, 640 470 C 540 430, 600 330, 680 380 C 760 430, 640 640, 380 760"/>
<path class="c ciz g2" pathLength="1" d="M488 780 L 380 760 L 435 665"/>
</g></svg>
</body></html>
