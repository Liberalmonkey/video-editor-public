<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Şok dalgası</title>
<!-- Proje yapımı saydam motion (ADR 0036). Render: vedit motion kur sok-dalgasi -->
<style>
html,body{margin:0;background:transparent;overflow:hidden}
svg{position:absolute;inset:0;width:1080px;height:1080px;overflow:visible}
.c{fill:none;stroke:var(--vurgu);stroke-width:22;stroke-linecap:round;stroke-linejoin:round}
.d{fill:var(--vurgu)}
.ciz{stroke-dasharray:1;stroke-dashoffset:1}
@keyframes ciz{to{stroke-dashoffset:0}}
circle{fill:none;stroke:var(--vurgu)}
.a{animation:dal .6s cubic-bezier(.1,.7,.3,1) both}
.b{animation:dal .58s cubic-bezier(.1,.7,.3,1) .16s both}
@keyframes dal{from{r:40px;stroke-width:36px;opacity:0}10%{opacity:1}70%{opacity:1}to{r:430px;stroke-width:2px;opacity:0}}
</style></head><body>
<svg viewBox="0 0 1080 1080"><circle class="a" cx="540" cy="540" r="40"/><circle class="b" cx="540" cy="540" r="40"/></svg>
</body></html>
