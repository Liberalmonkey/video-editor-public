<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Ajan adımları</title>
<!-- Proje yapımı parametrik motion şablonu (ADR 0036). Sanal saat window.seek ile sürülür. Üret: vedit motion kur ajan-adimlari -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:1080px;height:1080px;font-family:var(--font)}
.sahne{position:absolute;left:110px;top:310px;width:860px;box-sizing:border-box;opacity:0}
.panel{background:var(--zemin);border-radius:var(--kose,18px);border:2px solid color-mix(in srgb,var(--yazi) 12%,transparent);padding:36px 44px;box-sizing:border-box;box-shadow:var(--golge)}
.ust-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;padding-bottom:18px;border-bottom:1.5px solid color-mix(in srgb,var(--yazi) 8%,transparent)}
.baslik-alan{display:flex;align-items:center;gap:12px}
.canli-nokta{width:12px;height:12px;border-radius:50%;background:var(--vurgu)}
.ust-baslik{font-size:30px;font-weight:700;letter-spacing:1.5px;color:var(--soluk)}
.sayac-etiket{font-size:30px;font-weight:800;color:var(--ikincil);font-variant-numeric:tabular-nums;font-family:var(--font-rakam)}
.pencere{height:190px;overflow:hidden;position:relative}
.ray{position:absolute;left:0;top:0;width:100%;transition:none}
.satir{height:95px;display:flex;align-items:center;gap:22px;box-sizing:border-box}
.ikon-alani{width:46px;height:46px;position:relative;flex:none;display:flex;align-items:center;justify-content:center}
.spinner{position:absolute;inset:0;width:46px;height:46px;transform-origin:center center}
.spinner circle{fill:none;stroke:var(--vurgu);stroke-width:5;stroke-linecap:round;stroke-dasharray:75 35}
.tik-alani{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;transform:scale(0);opacity:0}
.tik-alani svg{width:44px;height:44px}
.tik-alani path{fill:none;stroke:var(--ikincil);stroke-width:5.5;stroke-linecap:round;stroke-linejoin:round}
.metin{font-size:35px;font-weight:700;color:var(--yazi);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:720px;line-height:1.2}
.satir.tamam .metin{color:var(--soluk);opacity:.75}
.satir.sonuc-satir{background:color-mix(in srgb,var(--vurgu) 10%,transparent);border-radius:12px;padding:0 18px;margin-left:-18px;width:calc(100% + 36px)}
.satir.sonuc-satir .metin{color:var(--vurgu);font-weight:800;font-size:36px}
.satir.sonuc-satir .tik-alani path{stroke:var(--vurgu);stroke-width:6}
</style></head><body>
<div class="sahne" id="sahne">
 <div class="panel">
  <div class="ust-bar">
   <div class="baslik-alan">
    <div class="canli-nokta" id="nokta"></div>
    <span class="ust-baslik" id="ustBaslik">GÖREV AKIŞI</span>
   </div>
   <div class="sayac-etiket" id="sayacEtiket">1/3</div>
  </div>
  <div class="pencere">
   <div class="ray" id="ray">
    <div class="satir" id="s1">
     <div class="ikon-alani">
      <svg class="spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"/></svg>
      <div class="tik-alani"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" fill="none" stroke="var(--ikincil)" stroke-width="3.5" opacity=".35"/><path d="M14 26 L22 34 L36 18"/></svg></div>
     </div>
     <span class="metin" id="t1"></span>
    </div>
    <div class="satir" id="s2">
     <div class="ikon-alani">
      <svg class="spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"/></svg>
      <div class="tik-alani"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" fill="none" stroke="var(--ikincil)" stroke-width="3.5" opacity=".35"/><path d="M14 26 L22 34 L36 18"/></svg></div>
     </div>
     <span class="metin" id="t2"></span>
    </div>
    <div class="satir" id="s3">
     <div class="ikon-alani">
      <svg class="spinner" viewBox="0 0 50 50"><circle cx="25" cy="25" r="20"/></svg>
      <div class="tik-alani"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" fill="none" stroke="var(--ikincil)" stroke-width="3.5" opacity=".35"/><path d="M14 26 L22 34 L36 18"/></svg></div>
     </div>
     <span class="metin" id="t3"></span>
    </div>
    <div class="satir sonuc-satir" id="s4">
     <div class="ikon-alani">
      <div class="tik-alani" style="opacity:1;transform:scale(1)"><svg viewBox="0 0 50 50"><circle cx="25" cy="25" r="21" fill="none" stroke="var(--vurgu)" stroke-width="4" opacity=".4"/><path d="M13 26 L21 34 L37 17"/></svg></div>
     </div>
     <span class="metin" id="t4"></span>
    </div>
   </div>
  </div>
 </div>
</div>
<script>
const P = Object.assign({
  adim1: "İçerik taranıyor...",
  adim2: "Model çalıştırılıyor...",
  adim3: "Sonuçlar doğrulanıyor...",
  sonuc: "Kurgu hazırlandı"
}, window.PARAM);

const $ = id => document.getElementById(id);
$("t1").textContent = P.adim1;
$("t2").textContent = P.adim2;
$("t3").textContent = P.adim3;
$("t4").textContent = P.sonuc;

$("ustBaslik").textContent = "GÖREV AKIŞI".toLocaleUpperCase("tr-TR");

const clamp = (v, min, max) => Math.min(max, Math.max(min, v));
const easeOut = x => 1 - Math.pow(1 - x, 3);
const easeInOut = x => x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
const springBack = x => 1 + 2.7 * Math.pow(x - 1, 3) + 1.7 * Math.pow(x - 1, 2);

const satirlar = [
  { el: $("s1"), spin: $("s1").querySelector(".spinner"), tik: $("s1").querySelector(".tik-alani") },
  { el: $("s2"), spin: $("s2").querySelector(".spinner"), tik: $("s2").querySelector(".tik-alani") },
  { el: $("s3"), spin: $("s3").querySelector(".spinner"), tik: $("s3").querySelector(".tik-alani") },
  { el: $("s4"), spin: null, tik: $("s4").querySelector(".tik-alani") }
];

window.seek = t => {
  // Toplam süre 4.5 sn
  // Giriş: 0.0 - 0.35s
  // Çıkış: 4.0 - 4.45s; 4.45+ tamamen boş (saydam)
  const gir = easeOut(clamp(t / 0.35, 0, 1));
  const cik = clamp((t - 4.0) / 0.45, 0, 1);
  const cikE = cik * cik;

  const sahne = $("sahne");
  if (t >= 4.45) {
    sahne.style.opacity = "0";
    return;
  }
  sahne.style.opacity = String(gir * (1 - cikE));
  const translateYGir = (1 - gir) * 35;
  const translateYCik = cikE * -25;
  sahne.style.transform = `translateY(${translateYGir + translateYCik}px) scale(${0.96 + gir * 0.04 - cikE * 0.04})`;

  // Süreç zamanlaması:
  // Adım 1 aktif: 0.2 - 1.1s (spinner döner), 1.1s'de tik olur
  // Kayma 1: 1.25 - 1.55s (ray translateY -95px)
  // Adım 2 aktif: 1.25 - 2.1s (spinner döner), 2.1s'de tik olur
  // Kayma 2: 2.25 - 2.55s (ray translateY -190px)
  // Adım 3 aktif: 2.25 - 3.1s (spinner döner), 3.1s'de tik olur
  // Kayma 3: 3.25 - 3.55s (ray translateY -285px) -> Sonuç satırı odaklanır

  // Ray konumu
  let kaymaHedef = 0;
  if (t >= 1.25 && t < 2.25) {
    const p = easeInOut(clamp((t - 1.25) / 0.3, 0, 1));
    kaymaHedef = 95 * p;
  } else if (t >= 2.25 && t < 3.25) {
    const p = easeInOut(clamp((t - 2.25) / 0.3, 0, 1));
    kaymaHedef = 95 + 95 * p;
  } else if (t >= 3.25) {
    const p = easeInOut(clamp((t - 3.25) / 0.3, 0, 1));
    kaymaHedef = 190 + 95 * p;
  }
  $("ray").style.transform = `translateY(-${kaymaHedef}px)`;

  // Sayac etiketi
  let aktifIndex = 1;
  if (t >= 3.25) {
    aktifIndex = 3;
    $("sayacEtiket").textContent = "TAMAM";
    $("sayacEtiket").style.color = "var(--vurgu)";
  } else if (t >= 2.25) {
    aktifIndex = 3;
    $("sayacEtiket").textContent = "3/3";
    $("sayacEtiket").style.color = "var(--ikincil)";
  } else if (t >= 1.25) {
    aktifIndex = 2;
    $("sayacEtiket").textContent = "2/3";
    $("sayacEtiket").style.color = "var(--ikincil)";
  } else {
    aktifIndex = 1;
    $("sayacEtiket").textContent = "1/3";
    $("sayacEtiket").style.color = "var(--ikincil)";
  }

  // Canli nokta nabzi
  const nabiz = 0.8 + 0.3 * Math.sin(t * 8);
  $("nokta").style.transform = `scale(${nabiz})`;
  $("nokta").style.opacity = String(0.7 + 0.3 * Math.sin(t * 8));

  // Spinner ve tik durumları
  const aci = (t * 480) % 360;

  // 1. Adım
  if (t < 1.1) {
    satirlar[0].spin.style.display = "block";
    satirlar[0].spin.style.transform = `rotate(${aci}deg)`;
    satirlar[0].tik.style.opacity = "0";
    satirlar[0].tik.style.transform = "scale(0)";
    satirlar[0].el.classList.remove("tamam");
  } else {
    satirlar[0].spin.style.display = "none";
    satirlar[0].el.classList.add("tamam");
    const pTik = springBack(clamp((t - 1.1) / 0.22, 0, 1));
    satirlar[0].tik.style.opacity = "1";
    satirlar[0].tik.style.transform = `scale(${pTik})`;
  }

  // 2. Adım
  if (t < 1.25) {
    satirlar[1].spin.style.opacity = "0.3";
    satirlar[1].spin.style.transform = "rotate(0deg)";
    satirlar[1].tik.style.opacity = "0";
    satirlar[1].tik.style.transform = "scale(0)";
    satirlar[1].el.classList.remove("tamam");
  } else if (t < 2.1) {
    satirlar[1].spin.style.opacity = "1";
    satirlar[1].spin.style.display = "block";
    satirlar[1].spin.style.transform = `rotate(${aci}deg)`;
    satirlar[1].tik.style.opacity = "0";
    satirlar[1].tik.style.transform = "scale(0)";
    satirlar[1].el.classList.remove("tamam");
  } else {
    satirlar[1].spin.style.display = "none";
    satirlar[1].el.classList.add("tamam");
    const pTik = springBack(clamp((t - 2.1) / 0.22, 0, 1));
    satirlar[1].tik.style.opacity = "1";
    satirlar[1].tik.style.transform = `scale(${pTik})`;
  }

  // 3. Adım
  if (t < 2.25) {
    satirlar[2].spin.style.opacity = "0.3";
    satirlar[2].spin.style.transform = "rotate(0deg)";
    satirlar[2].tik.style.opacity = "0";
    satirlar[2].tik.style.transform = "scale(0)";
    satirlar[2].el.classList.remove("tamam");
  } else if (t < 3.1) {
    satirlar[2].spin.style.opacity = "1";
    satirlar[2].spin.style.display = "block";
    satirlar[2].spin.style.transform = `rotate(${aci}deg)`;
    satirlar[2].tik.style.opacity = "0";
    satirlar[2].tik.style.transform = "scale(0)";
    satirlar[2].el.classList.remove("tamam");
  } else {
    satirlar[2].spin.style.display = "none";
    satirlar[2].el.classList.add("tamam");
    const pTik = springBack(clamp((t - 3.1) / 0.22, 0, 1));
    satirlar[2].tik.style.opacity = "1";
    satirlar[2].tik.style.transform = `scale(${pTik})`;
  }

  // Sonuç Satırı
  if (t >= 3.25) {
    const pSonuc = springBack(clamp((t - 3.25) / 0.25, 0, 1));
    satirlar[3].tik.style.transform = `scale(${pSonuc})`;
    satirlar[3].el.style.opacity = String(clamp((t - 3.25) / 0.2, 0, 1));
  } else {
    satirlar[3].el.style.opacity = "0.3";
  }
};

window.seek(0);
</script>
</body></html>
