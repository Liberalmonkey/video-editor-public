<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Vizör köşeleri: odak alanı</title>
<!-- Proje yapımı saydam çerçeve (ADR 0036). İçi boş: altındaki videonun bir bölümünü çevreler. 0.4 sn giriş, bekleme, 0.3 sn çıkış. -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:1080px;height:1080px}
svg{position:absolute;inset:0;width:1080px;height:1080px}
svg *{transform-box:view-box}
.cik{transform-origin:540px 540px;animation:cik .3s cubic-bezier(.5,0,.75,0) 2.7s both}
@keyframes cik{to{opacity:0;transform:scale(.97)}}
.k{fill:none;stroke:var(--yazi);stroke-width:16;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 6px rgba(0,0,0,.45));animation:ciz .4s cubic-bezier(.2,.8,.3,1) both}
@keyframes ciz{from{stroke-dashoffset:1;transform:translate(var(--dx),var(--dy))}to{stroke-dashoffset:0;transform:none}}
</style></head><body>
<svg viewBox="0 0 1080 1080"><g class="cik"><path class="k" pathLength="1" style="--dx:-30px;--dy:-30px" d="M140 300 V140 H300"/><path class="k" pathLength="1" style="--dx:30px;--dy:-30px" d="M780 140 H940 V300"/><path class="k" pathLength="1" style="--dx:30px;--dy:30px" d="M940 780 V940 H780"/><path class="k" pathLength="1" style="--dx:-30px;--dy:30px" d="M300 940 H140 V780"/></g></svg>
</body></html>
