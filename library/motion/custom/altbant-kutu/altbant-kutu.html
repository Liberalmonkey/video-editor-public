<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>Alt bant kutu</title>
<!-- Proje yapımı motion şablonu (ADR 0036). Üret: vedit motion kur altbant-kutu -->
<style>
html,body{margin:0;background:transparent;overflow:hidden;width:100vw;height:100vh}
.sahne{position:absolute;left:9vw;bottom:32vh;max-width:65vw;font-family:var(--font)}
.kutu{background:var(--zemin);color:var(--yazi);border-radius:var(--kose,18px);padding:2.8vmin 4vmin 3vmin;
  animation:ac .45s cubic-bezier(.65,0,.35,1) .05s both,kapa .4s cubic-bezier(.65,0,.35,1) 3.42s both}
.satir{overflow:hidden}
.ad{display:inline-block;font-weight:var(--agirlik,800);font-size:6.4vmin;line-height:1.12;animation:yuksel .45s cubic-bezier(.16,1,.3,1) .35s both,sol .2s ease-in 3.25s both}
.cizgi{height:max(var(--cizgi,10px),.5vmin);background:var(--vurgu);border-radius:99px;margin:1.4vmin 0 1.3vmin;transform-origin:left center;
  animation:uza .45s cubic-bezier(.16,1,.3,1) .6s both,sol .2s ease-in 3.25s both}
.unvan{display:inline-block;font-weight:500;font-size:3.8vmin;line-height:1.2;opacity:.85;animation:yuksel .45s cubic-bezier(.16,1,.3,1) .75s both,sol .2s ease-in 3.25s both}
@keyframes ac{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes kapa{from{clip-path:inset(0 0 0 0)}to{clip-path:inset(0 0 0 100%)}}
@keyframes yuksel{from{transform:translateY(110%)}to{transform:translateY(0)}}
@keyframes uza{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes sol{to{opacity:0}}
</style></head><body>
<div class="sahne"><div class="kutu"><div class="satir"><span class="ad" id="ad"></span></div><div class="cizgi"></div><div class="satir"><span class="unvan" id="unvan"></span></div></div></div>
<script>
const P = Object.assign({ ad: "Ad Soyad", unvan: "Unvan" }, window.PARAM);
const ad = document.getElementById("ad"), unvan = document.getElementById("unvan");
ad.textContent = P.ad; unvan.textContent = P.unvan;
if (!P.unvan) unvan.parentNode.style.display = "none";
// Uzun metin tek satırda küçülür; alt sınırda da sığmazsa satıra bölünür.
function sigdir(el, taban, alt, maxPx) {
  el.style.whiteSpace = "nowrap"; el.style.maxWidth = ""; let f = taban; el.style.fontSize = f + "vmin";
  while (el.getBoundingClientRect().width > maxPx && f > alt) { f -= .1; el.style.fontSize = f + "vmin"; }
  if (el.getBoundingClientRect().width > maxPx) { el.style.whiteSpace = "normal"; el.style.maxWidth = maxPx + "px"; }
}
function kur() {
  const vm = Math.min(innerWidth, innerHeight) / 100, max = innerWidth * .65 - vm * 8;
  sigdir(ad, 6.4, 3.6, max); sigdir(unvan, 3.8, 3.2, max);
}
kur();
let hazir = false;
window.seek = () => { if (!hazir) { hazir = true; kur(); } }; // tema ve font yüklendikten sonra bir kez yeniden ölç
</script>
</body></html>
