<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><link rel="stylesheet" href="../../tema/varsayilan.css"><title>CRT tüplü ekran kapanışı 9:16</title>
<!-- Saydam geçiş (ADR 0036). Ekran sürenin tam ortasında (0,40 sn) tamamen kapalı: kesim oraya konur.
     Zaman window.seek(t) ile sürülür; ilk ve son kare saydam. Renkler temadan. -->
<style>html,body{margin:0;background:transparent;overflow:hidden}canvas{position:absolute;left:0;top:0;width:100vw;height:100vh}</style>
</head><body><canvas id="c"></canvas><script>
const D=0.8;
const c=document.getElementById('c'),x=c.getContext('2d');
const R=(n,v)=>getComputedStyle(document.documentElement).getPropertyValue(n).trim()||v;
const cl=v=>Math.min(1,Math.max(0,v)), ara=(p,a,b)=>cl((p-a)/(b-a)), lerp=(a,b,u)=>a+(b-a)*u;
const eO=u=>1-Math.pow(1-u,3), eI=u=>u*u*u, eIO=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
function tohum(s){return()=>{s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const GA=.06,GB=.46,CA=.53,CB=.88;
let RENK={};
window.seek=t=>{
  if(c.width!==innerWidth||c.height!==innerHeight){c.width=innerWidth;c.height=innerHeight}
  const W=c.width,H=c.height;x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
  RENK={v:R('--vurgu'),i:R('--ikincil'),z:R('--zemin'),y:R('--yazi')};
  const p=cl(t/D);if(p<=GA||p>=CB)return;ciz(p,W,H);
};

function ciz(p,W,H){
  const YC=H/2, XC=W/2;
  if(p<GB){
    const u=ara(p,GA,GB);
    if(u<0.58){
      const u1=u/0.58, sq=u1*u1*(3-2*u1), h=Math.max(8,H*(1-sq));
      const top=Math.floor(YC-h/2), bot=Math.ceil(YC+h/2);
      x.fillStyle=RENK.z;
      if(top>0)x.fillRect(0,0,W,top);
      if(bot<H)x.fillRect(0,bot,W,H-bot);
      const barH=Math.max(6,lerp(8,28,sq));
      x.fillStyle=RENK.v;
      x.fillRect(0,Math.max(0,top-barH/2),W,barH);
      x.fillRect(0,Math.min(H-barH,bot-barH/2),W,barH);
      x.fillStyle=RENK.y;
      x.fillRect(0,top,W,Math.min(5,h));
      x.fillRect(0,Math.max(top,bot-5),W,Math.min(5,h));
      x.fillStyle=RENK.v;
      x.globalAlpha=0.3*sq;
      for(let y=top+10;y<bot-10;y+=14)x.fillRect(0,y,W,4);
      x.globalAlpha=1;
    }else{
      const u2=(u-0.58)/0.42;
      x.fillStyle=RENK.z;x.fillRect(0,0,W,H);
      if(u2<0.65){
        const uL=u2/0.65, w=Math.max(0,W*(1-eIO(uL))), lh=lerp(16,5,uL);
        const x0=XC-w/2;
        x.fillStyle=RENK.v;x.fillRect(x0,YC-lh*1.4,w,lh*2.8);
        x.fillStyle=RENK.i;x.fillRect(x0+w*0.08,YC-lh*0.7,w*0.84,lh*1.4);
        x.fillStyle=RENK.y;x.fillRect(x0+w*0.18,YC-lh*0.35,w*0.64,lh*0.7);
      }
      const uD=ara(u2,0.3,1), rDot=lerp(42,0,eI(uD));
      if(rDot>0.5){
        x.beginPath();x.arc(XC,YC,rDot*1.6,0,Math.PI*2);x.fillStyle=RENK.v;x.fill();
        x.beginPath();x.arc(XC,YC,rDot*0.95,0,Math.PI*2);x.fillStyle=RENK.i;x.fill();
        x.beginPath();x.arc(XC,YC,rDot*0.45,0,Math.PI*2);x.fillStyle=RENK.y;x.fill();
      }
    }
  }else if(p<CA){
    x.fillStyle=RENK.z;x.fillRect(0,0,W,H);
  }else{
    const u=ara(p,CA,CB);
    if(u<0.12){
      const u0=u/0.12, w=W*eO(u0), lh=lerp(6,18,u0);
      x.fillStyle=RENK.z;x.fillRect(0,0,W,H);
      x.fillStyle=RENK.v;x.fillRect(XC-w/2,YC-lh,w,lh*2);
      x.fillStyle=RENK.y;x.fillRect(XC-w*0.4,YC-lh*0.4,w*0.8,lh*0.8);
    }else{
      const u1=(u-0.12)/0.88, open=eO(u1);
      const h=H*open, top=Math.floor(YC-h/2), bot=Math.ceil(YC+h/2);
      x.fillStyle=RENK.z;
      if(top>0)x.fillRect(0,0,W,top);
      if(bot<H)x.fillRect(0,bot,W,H-bot);
      // Yatay tarama çizgileriyle (scanline) açılış
      const step=28, band=1-u1;
      const rnd=tohum(901);
      for(let y=0;y<H;y+=step){
        const dist=Math.abs(y+step/2-YC)/(H/2);
        const jitter=(rnd()-0.5)*0.08;
        const local=cl((dist+jitter-open*0.92)/0.36+1);
        if(y+step>top && y<bot && local>0){
          const sh=step*cl(local)*band;
          if(sh>1){
            x.fillStyle=RENK.z;
            x.fillRect(0,y+(step-sh)/2,W,sh);
            if(sh>4){
              x.fillStyle=RENK.v;
              x.fillRect(0,y+(step-sh)/2,W,2.5);
            }
          }
        }
      }
      const glowH=lerp(28,6,u1);
      if(top>0){
        x.fillStyle=RENK.v;x.fillRect(0,Math.max(0,top-glowH/2),W,glowH);
        x.fillStyle=RENK.i;x.fillRect(0,top,W,Math.max(3,glowH*0.35));
      }
      if(bot<H){
        x.fillStyle=RENK.v;x.fillRect(0,Math.min(H-glowH,bot-glowH/2),W,glowH);
        x.fillStyle=RENK.i;x.fillRect(0,bot-Math.max(3,glowH*0.35),W,Math.max(3,glowH*0.35));
      }
      if(band>0.05){
        x.fillStyle=RENK.v;
        x.globalAlpha=0.42*band*band;
        for(let y=Math.max(0,top);y<Math.min(H,bot);y+=16){
          x.fillRect(0,y,W,3.5);
        }
        const sweepY=lerp(top,bot,(u1*1.6)%1);
        x.globalAlpha=0.6*band;
        x.fillRect(0,sweepY-7,W,14);
        x.globalAlpha=1;
      }
    }
  }
}
window.seek(0);
</script></body></html>
